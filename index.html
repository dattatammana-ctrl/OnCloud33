<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Events</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  text-align: center;
}

/* Carousel */
.carousel {
  position: relative;
  overflow: hidden;
  height: 300px;
}

.carousel-slide {
  display: none;
  height: 300px;
}

.carousel-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.carousel-slide.active {
  display: block;
}

/* Events */
.events {
  padding: 20px;
}

.event-card {
  background: white;
  margin: 15px 0;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  position: relative;
}

/* ⏳ Countdown top-right */
.countdown {
  position: absolute;
  top: 15px;
  right: 15px;
  background: #000;
  color: #fff;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
}

/* Buttons */
button {
  padding: 8px 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.interest-btn {
  background: #ff6b6b;
  color: white;
}

</style>
</head>

<body>

<header>
  <h1>Community Events</h1>
</header>

<!-- 👀 VIEW COUNTER -->
<div style="text-align:center; margin:10px;">
  👀 Views: <span id="viewCount">0</span>
</div>

<!-- 🎞️ CAROUSEL -->
<div class="carousel" id="heroCarousel">
  <div class="carousel-slide active">
    <img src="https://via.placeholder.com/1200x300?text=Vinayaka+Chaturthi">
  </div>
  <div class="carousel-slide">
    <img src="https://via.placeholder.com/1200x300?text=Navaratri">
  </div>
  <div class="carousel-slide">
    <img src="https://via.placeholder.com/1200x300?text=Dussehra">
  </div>
</div>

<!-- EVENTS -->
<div class="events">

  <!-- Vinayaka -->
  <div class="event-card">
    <div class="countdown" id="vinayaka-timer"></div>
    <h2>🪔 Vinayaka Chaturthi</h2>
    <button class="interest-btn" onclick="markInterested('vinayaka')">❤️ Interested</button>
    <p id="vinayaka-count">0 interested</p>
  </div>

  <!-- Navaratri -->
  <div class="event-card">
    <div class="countdown" id="navaratri-timer"></div>
    <h2>🌸 Navaratri</h2>
    <button class="interest-btn" onclick="markInterested('navaratri')">❤️ Interested</button>
    <p id="navaratri-count">0 interested</p>
  </div>

  <!-- Dussehra -->
  <div class="event-card">
    <div class="countdown" id="dussehra-timer"></div>
    <h2>🏹 Dussehra</h2>
    <button class="interest-btn" onclick="markInterested('dussehra')">❤️ Interested</button>
    <p id="dussehra-count">0 interested</p>
  </div>

</div>

<script>

/* 👀 VIEW COUNTER */
let views = localStorage.getItem("views") || 0;
views++;
localStorage.setItem("views", views);
document.getElementById("viewCount").innerText = views;

/* ❤️ INTEREST */
function markInterested(event) {
  let count = localStorage.getItem(event) || 0;
  count++;
  localStorage.setItem(event, count);
  document.getElementById(event + "-count").innerText = count + " interested";
}

/* LOAD COUNTS */
["vinayaka","navaratri","dussehra"].forEach(e=>{
  let count = localStorage.getItem(e) || 0;
  document.getElementById(e + "-count").innerText = count + " interested";
});

/* 🎞️ AUTO SLIDER */
let currentSlide = 0;
const slides = document.querySelectorAll('.carousel-slide');

function showSlide(i){
  slides.forEach((s,index)=>s.classList.toggle('active', index===i));
}

setInterval(()=>{
  currentSlide = (currentSlide + 1) % slides.length;
  showSlide(currentSlide);
},10000);

/* ⏳ COUNTDOWN FUNCTION */
function startCountdown(id, dateStr){
  const target = new Date(dateStr).getTime();

  setInterval(()=>{
    const now = new Date().getTime();
    const diff = target - now;

    if(diff <= 0){
      document.getElementById(id).innerText = "Started 🎉";
      return;
    }

    const days = Math.floor(diff / (1000*60*60*24));
    const hrs = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    const mins = Math.floor((diff % (1000*60*60)) / (1000*60));
    const secs = Math.floor((diff % (1000*60)) / 1000);

    document.getElementById(id).innerText =
      `${days}d ${hrs}h ${mins}m ${secs}s`;
  },1000);
}

/* 🎯 SET EVENT DATES (EDIT THESE) */
startCountdown("vinayaka-timer", "2026-09-07T00:00:00");
startCountdown("navaratri-timer", "2026-10-15T00:00:00");
startCountdown("dussehra-timer", "2026-10-24T00:00:00");

</script>

</body>
</html>
